<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Chronos - Timer Test</title>
</head>
<body>
    <h1>Timer Page Test</h1>
    <p>User: <span th:text="${currentUser != null ? currentUser.name : 'Guest'}">Guest</span></p>
    <p>Task Count: <span th:text="${tasks != null ? #lists.size(tasks) : 0}">0</span></p>
    <p>Recent Sessions: <span th:text="${recentSessions != null ? #lists.size(recentSessions) : 0}">0</span></p>
    <p>Active Pomodoros: <span th:text="${activePomodoros != null ? #lists.size(activePomodoros) : 0}">0</span></p>
    <p>Total Sessions: <span th:text="${totalSessions}">0</span></p>
    <p>Default Duration: <span th:text="${defaultDuration}">0</span></p>
</body>
</html>
