<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Chronos - User Form</title>
    <link th:href="@{/css/style.css}" rel="stylesheet"/>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; background: #f5f7fa; color: #333; }
        .header { background: linear-gradient(135deg, #667eea 0%, #764ba2 100%); color: white; padding: 1rem 2rem; display: flex; justify-content: space-between; align-items: center; }
        .header h1 { font-size: 1.5rem; }
        .nav { display: flex; gap: 0.5rem; }
        .nav a { padding: 0.5rem 1rem; background: rgba(255,255,255,0.2); color: white; text-decoration: none; border-radius: 6px; font-size: 0.9rem; transition: all 0.2s; }
        .nav a:hover { background: rgba(255,255,255,0.3); }
        .nav a.active { background: white; color: #667eea; font-weight: 600; }
        .container { max-width: 600px; margin: 0 auto; padding: 2rem; }
        .user-badge { display: inline-block; padding: 0.2rem 0.6rem; background: #e8e8e8; color: #555; border-radius: 20px; font-size: 0.8rem; margin-bottom: 1rem; }
        .user-badge.guest { background: #c62828; color: white; }
        .section { background: white; border-radius: 12px; box-shadow: 0 4px 6px rgba(0,0,0,0.1); overflow: hidden; }
        .section-header { padding: 1.5rem; border-bottom: 1px solid #e8e8e8; background: #f8f9fa; }
        .section-header h2 { font-size: 1.25rem; color: #333; display: flex; align-items: center; gap: 0.5rem; }
        .section-body { padding: 1.5rem; }
        .form-group { margin-bottom: 1.25rem; }
        .form-group label { display: block; margin-bottom: 0.4rem; font-weight: 600; color: #555; }
        .form-group input, .form-group select { width: 100%; padding: 0.75rem; border: 1px solid #ddd; border-radius: 6px; font-size: 0.95rem; }
        .form-group input:focus, .form-group select:focus { outline: none; border-color: #667eea; }
        .btn { padding: 0.75rem 1.5rem; border: none; border-radius: 6px; cursor: pointer; font-weight: 600; text-decoration: none; display: inline-block; transition: all 0.2s; font-size: 1rem; }
        .btn-primary { background: #667eea; color: white; }
        .btn-primary:hover { background: #5568d3; }
        .btn-outline { background: transparent; color: #667eea; border: 2px solid #667eea; margin-left: 0.75rem; }
        .btn-outline:hover { background: #667eea; color: white; }
        .footer { text-align: center; padding: 2rem; color: #888; font-size: 0.9rem; border-top: 1px solid #e8e8e8; margin-top: 2rem; }
    </style>
</head>
<body>
    <div class="header">
        <h1>Chronos</h1>
        <nav class="nav">
            <a href="/timer">Timer</a>
            <a href="/tasks">Tasks</a>
            <a href="/users">Users</a>
            <a href="/sessions">Sessions</a>
            <a href="/reports">Reports</a>
            <a href="/settings">Settings</a>
            <a href="/logout">Logout</a>
        </nav>
    </div>

    <div class="container">
        <div th:if="${isGuest}" class="user-badge guest">Guest Mode</div>
        <div th:unless="${isGuest}" class="user-badge" th:text="${'User: ' + ${currentUser.name} + ' (' + ${currentUser.role} + ')}">User</div>

        <div class="section">
            <div class="section-header">
                <h2 th:text="${user.id gt 0 ? 'Edit User' : 'Add New User'}">Add New User</h2>
            </div>
            <div class="section-body">
                <form th:action="${user.id gt 0 ? '/users/' + ${user.id} : '/users'}" method="post">
                    <div class="form-group">
                        <label for="name">Full Name</label>
                        <input type="text" id="name" name="name" th:value="${user.name}" required/>
                    </div>
                    <div class="form-group">
                        <label for="email">Email Address</label>
                        <input type="email" id="email" name="email" th:value="${user.email}" required/>
                    </div>
                    <div class="form-group">
                        <label for="role">Role</label>
                        <select id="role" name="role">
                            <option th:each="role : ${roles}" th:value="${role}" th:text="${role}" th:selected="${role == user.role}">ADMIN</option>
                        </select>
                    </div>
                    <div style="display: flex; gap: 0.75rem; justify-content: flex-end; margin-top: 1.5rem;">
                        <a href="/users" class="btn btn-outline">Cancel</a>
                        <button type="submit" class="btn btn-primary">Save User</button>
                    </div>
                </form>
            </div>
        </div>
    </div>
</body>
</html>
