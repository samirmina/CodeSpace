<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Chronos - Users</title>
    <link th:href="@{/style.css}" rel="stylesheet"/>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; background: #f5f7fa; color: #333; line-height: 1.6; }
        .header { background: linear-gradient(135deg, #667eea 0%, #764ba2 100%); color: white; padding: 2rem 1rem; text-align: center; }
        .header h1 { font-size: 2.5rem; margin-bottom: 0.5rem; }
        .header p { font-size: 1.1rem; opacity: 0.9; }
        .container { max-width: 1200px; margin: 0 auto; padding: 2rem 1rem; }
        .nav { display: flex; gap: 0.5rem; justify-content: center; margin-bottom: 2rem; flex-wrap: wrap; }
        .nav a { padding: 0.75rem 1.5rem; background: white; color: #667eea; text-decoration: none; border-radius: 8px; border: 2px solid #667eea; font-weight: 600; transition: all 0.3s; }
        .nav a:hover { background: #667eea; color: white; }
        .nav a.active { background: #667eea; color: white; }
        .page-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 1.5rem; flex-wrap: wrap; gap: 1rem; }
        .page-header h2 { font-size: 1.5rem; color: #333; }
        .btn { padding: 0.5rem 1rem; border: none; border-radius: 6px; cursor: pointer; font-weight: 600; text-decoration: none; display: inline-block; transition: all 0.3s; font-size: 0.9rem; }
        .btn-primary { background: #667eea; color: white; }
        .btn-primary:hover { background: #5568d3; }
        .btn-danger { background: #c62828; color: white; padding: 0.4rem 0.8rem; font-size: 0.85rem; }
        .btn-danger:hover { background: #b71c1c; }
        .btn-sm { padding: 0.25rem 0.6rem; font-size: 0.85rem; }
        .section { background: white; border-radius: 12px; box-shadow: 0 4px 6px rgba(0,0,0,0.1); overflow: hidden; }
        .section-header { padding: 1.5rem; border-bottom: 1px solid #e8e8e8; background: #f8f9fa; }
        .section-header h2 { font-size: 1.25rem; color: #333; display: flex; align-items: center; gap: 0.5rem; }
        .section-body { padding: 1.5rem; }
        table { width: 100%; border-collapse: collapse; }
        th, td { padding: 1rem; text-align: left; border-bottom: 1px solid #e8e8e8; }
        th { background: #f8f9fa; font-weight: 600; color: #667eea; text-transform: uppercase; font-size: 0.85rem; letter-spacing: 0.5px; }
        tr:hover { background: #f5f7fa; }
        .badge { display: inline-block; padding: 0.25rem 0.75rem; border-radius: 20px; font-size: 0.8rem; font-weight: 600; }
        .badge-developer { background: #e3f2fd; color: #1565c0; }
        .badge-manager { background: #fff3e0; color: #e65100; }
        .badge-admin { background: #f3e5f5; color: #7b1fa2; }
        .actions { display: flex; gap: 0.5rem; }
        .form-group { margin-bottom: 1rem; }
        .form-group label { display: block; margin-bottom: 0.4rem; font-weight: 600; color: #555; }
        .form-group input, .form-group select { width: 100%; padding: 0.6rem; border: 1px solid #ddd; border-radius: 6px; font-size: 0.95rem; }
        .form-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(250px, 1fr)); gap: 1rem; }
        .empty-state { text-align: center; padding: 3rem 1rem; color: #888; }
        .footer { text-align: center; padding: 2rem; color: #888; font-size: 0.9rem; border-top: 1px solid #e8e8e8; margin-top: 2rem; }
    </style>
</head>
<body>
    <div class="header">
        <h1>Chronos</h1>
        <p>User Management — Web Interface</p>
    </div>

    <nav class="nav">
        <a href="/">Dashboard</a>
        <a href="/users" class="active">Users</a>
        <a href="/tasks">Tasks</a>
        <a href="/launch">Launch JavaFX GUI</a>
    </nav>

    <div class="container">
        <div class="page-header">
            <h2>👥 Users</h2>
            <a href="/users/new" class="btn btn-primary">+ Add User</a>
        </div>

        <div class="section">
            <div class="section-body">
                <table>
                    <thead>
                        <tr>
                            <th>ID</th>
                            <th>Name</th>
                            <th>Email</th>
                            <th>Role</th>
                            <th>Tasks</th>
                            <th>Completed</th>
                            <th>Created</th>
                            <th>Actions</th>
                        </tr>
                    </thead>
                    <tbody>
                        <tr th:each="user : ${users}">
                            <td th:text="${user.id}">-</td>
                            <td th:text="${user.name}">-</td>
                            <td th:text="${user.email}">-</td>
                            <td><span class="badge" th:class="'badge-' + ${user.role.name().toLowerCase()}" th:text="${user.role}">-</span></td>
                            <td th:text="${user.assignedTaskIds.size()}">-</td>
                            <td th:text="${user.tasksCompletedCount}">-</td>
                            <td th:text="${user.createdAt}">-</td>
                            <td class="actions">
                                <a th:href="@{/users/{id}/edit(id=${user.id})}" class="btn btn-sm btn-primary">Edit</a>
                                <form th:action="@{/users/{id}/delete(id=${user.id})}" method="post" style="display:inline;">
                                    <button type="submit" class="btn btn-sm btn-danger" onclick="return confirm('Delete this user?')">Delete</button>
                                </form>
                            </td>
                        </tr>
                    </tbody>
                </table>
                <div th:if="${#lists.isEmpty(users)}" class="empty-state">
                    <p>No users found. Add your first user.</p>
                </div>
            </div>
        </div>
    </div>

    <div class="footer">
        &copy; 2026 Chronos Team — Web Interface &amp; JavaFX Desktop GUI
    </div>
</body>
</html>
