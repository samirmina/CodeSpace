<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Chronos - Task Form</title>
    <link th:href="@{/style.css}" rel="stylesheet"/>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; background: #f5f7fa; color: #333; line-height: 1.6; }
        .header { background: linear-gradient(135deg, #667eea 0%, #764ba2 100%); color: white; padding: 2rem 1rem; text-align: center; }
        .header h1 { font-size: 2.5rem; margin-bottom: 0.5rem; }
        .header p { font-size: 1.1rem; opacity: 0.9; }
        .container { max-width: 700px; margin: 0 auto; padding: 2rem 1rem; }
        .nav { display: flex; gap: 0.5rem; justify-content: center; margin-bottom: 2rem; flex-wrap: wrap; }
        .nav a { padding: 0.75rem 1.5rem; background: white; color: #667eea; text-decoration: none; border-radius: 8px; border: 2px solid #667eea; font-weight: 600; transition: all 0.3s; }
        .nav a:hover { background: #667eea; color: white; }
        .nav a.active { background: #667eea; color: white; }
        .section { background: white; border-radius: 12px; box-shadow: 0 4px 6px rgba(0,0,0,0.1); overflow: hidden; }
        .section-header { padding: 1.5rem; border-bottom: 1px solid #e8e8e8; background: #f8f9fa; }
        .section-header h2 { font-size: 1.25rem; color: #333; display: flex; align-items: center; gap: 0.5rem; }
        .section-body { padding: 1.5rem; }
        .form-group { margin-bottom: 1.25rem; }
        .form-group label { display: block; margin-bottom: 0.4rem; font-weight: 600; color: #555; }
        .form-group input, .form-group select, .form-group textarea { width: 100%; padding: 0.75rem; border: 1px solid #ddd; border-radius: 6px; font-size: 0.95rem; }
        .form-group input:focus, .form-group select:focus, .form-group textarea:focus { outline: none; border-color: #667eea; }
        .form-group textarea { min-height: 100px; resize: vertical; }
        .btn { padding: 0.75rem 1.5rem; border: none; border-radius: 6px; cursor: pointer; font-weight: 600; text-decoration: none; display: inline-block; transition: all 0.3s; font-size: 1rem; }
        .btn-primary { background: #667eea; color: white; }
        .btn-primary:hover { background: #5568d3; }
        .btn-outline { background: transparent; color: #667eea; border: 2px solid #667eea; margin-left: 0.75rem; }
        .btn-outline:hover { background: #667eea; color: white; }
        .footer { text-align: center; padding: 2rem; color: #888; font-size: 0.9rem; border-top: 1px solid #e8e8e8; margin-top: 2rem; }
    </style>
</head>
<body>
    <div class="header">
        <h1>Chronos</h1>
        <p>Task Management — Web Interface</p>
    </div>

    <nav class="nav">
        <a href="/">Dashboard</a>
        <a href="/users">Users</a>
        <a href="/tasks">Tasks</a>
        <a href="/launch">Launch JavaFX GUI</a>
    </nav>

    <div class="container">
        <div class="section">
            <div class="section-header">
                <h2 th:text="${task.id gt 0 ? 'Edit Task' : 'Add New Task'}">Add New Task</h2>
            </div>
            <div class="section-body">
                <form th:action="${task.id gt 0 ? '/tasks/' + ${task.id} : '/tasks'}" method="post">
                    <div class="form-group">
                        <label for="title">Task Title</label>
                        <input type="text" id="title" name="title" th:value="${task.title}" required/>
                    </div>
                    <div class="form-group">
                        <label for="description">Description</label>
                        <textarea id="description" name="description" th:text="${task.description}"></textarea>
                    </div>
                    <div class="form-grid">
                        <div class="form-group">
                            <label for="priority">Priority</label>
                            <select id="priority" name="priority">
                                <option th:each="priority : ${priorities}" th:value="${priority}" th:text="${priority}" th:selected="${priority == task.priority}">LOW</option>
                            </select>
                        </div>
                        <div class="form-group">
                            <label for="status">Status</label>
                            <select id="status" name="status">
                                <option th:each="status : ${statuses}" th:value="${status}" th:text="${status}" th:selected="${status == task.status}">PENDING</option>
                            </select>
                        </div>
                        <div class="form-group">
                            <label for="assignedUserId">Assigned User</label>
                            <select id="assignedUserId" name="assignedUserId">
                                <option value="-1">Unassigned</option>
                                <option th:each="user : ${users}" th:value="${user.id}" th:text="${user.name} + ' (' + ${user.email} + ')'">User</option>
                            </select>
                        </div>
                    </div>
                    <div style="display: flex; gap: 0.75rem; justify-content: flex-end; margin-top: 1.5rem;">
                        <a href="/tasks" class="btn btn-outline">Cancel</a>
                        <button type="submit" class="btn btn-primary">Save Task</button>
                    </div>
                </form>
            </div>
        </div>
    </div>

    <div class="footer">
        &copy; 2026 Chronos Team — Web Interface &amp; JavaFX Desktop GUI
    </div>
</body>
</html>
