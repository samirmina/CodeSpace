# Server configuration
server.port=${PORT:8080}

# Spring Boot lazy initialization - defer bean creation until first use
spring.main.lazy-initialization=true

# Disable DataSource auto-configuration - we use raw JDBC via DAOs, not Spring Data JPA
spring.autoconfigure.exclude=org.springframework.boot.autoconfigure.jdbc.DataSourceAutoConfiguration,org.springframework.boot.autoconfigure.orm.jpa.HibernateJpaAutoConfiguration

# Disable Thymeleaf auto-configuration - we generate HTML programmatically in Java
spring.thymeleaf.enabled=false

# Logging
logging.level.root=INFO
logging.level.web=INFO
logging.level.services=INFO