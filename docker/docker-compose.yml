services:
  postgres:
    image: postgres:16-alpine
    container_name: chronos-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: chronos
      POSTGRES_USER: chronos
      POSTGRES_PASSWORD: chronos
    volumes:
      - chronos_pgdata:/var/lib/postgresql/data
      - ./schema.sql:/docker-entrypoint-initdb.d/01-schema.sql:ro
    ports:
      - "5433:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U chronos -d chronos"]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - chronos-network

  chronos-app:
    build:
      context: ..
      dockerfile: docker/Dockerfile
    container_name: chronos-app
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      DB_URL: jdbc:postgresql://postgres:5432/chronos
      DB_USER: chronos
      DB_PASSWORD: chronos
      APP_DATA_DIR: /app/data
      DISPLAY: :99
    environment:
      - DISPLAY=${DISPLAY:-:99}
    volumes:
      - chronos_data:/app/data
      - /tmp/.X11-unix:/tmp/.X11-unix
    networks:
      - chronos-network

volumes:
  chronos_pgdata:
  chronos_data:

networks:
  chronos-network:
    driver: bridge